name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no module dependencies, hence no go.sum to key on
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: 32-bit integer regressions
        run: GOARCH=386 CGO_ENABLED=0 go test -count=1 ./pkg/...
      - name: Offline database generator tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -v
      - name: Build
        run: go build -o xlfp . && ./xlfp version
      - name: Shell scripts syntax
        run: sh -n install.sh && sh -n scripts/install-skill.sh
      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
